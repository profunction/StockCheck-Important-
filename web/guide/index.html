<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用教程 · JEXO Count · JEXO POS · Warehouse · Cloud</title>
  <meta name="description" content="Step-by-step guides and short narrated videos for JEXO Count (phone and web), JEXO POS, JEXO Warehouse, JEXO Cloud and signing up. 中文 / English / Bahasa Melayu.">
  <link rel="icon" type="image/png" href="/icons/icon-64.png">
  <link rel="stylesheet" href="/css/pos.css">
  <style>
    body { background: var(--bg); }
    .gp { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 18px; }
    .gp header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .gp header h1 { margin: 0; }
    .gp .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .gp .tabs button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .gp-split { display: grid; gap: 18px; grid-template-columns: 1fr 300px; align-items: start; }
    .gp-split .acct { position: sticky; top: 16px; display: grid; gap: 12px; }
    .acct-go { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; }
    .acct-go small { font-weight: 500; opacity: .85; }
    @media (max-width: 860px) {
      .gp-split { grid-template-columns: 1fr; }
      .gp-split .acct { position: static; order: -1; }
    }
  </style>
</head>
<body>
  <div class="gp" id="gp"></div>
  <script type="module" src="/guide/page.js"></script>
</body>
</html>
