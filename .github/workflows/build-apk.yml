name: Build APK

# Every push builds an installable APK and publishes it where a phone can
# reach it. The project is developed from a phone; a build that only exists on
# a developer's laptop is a build nobody can install.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      # Named so several APKs can sit in a downloads folder and still be told
      # apart: which branch, which commit.
      - name: Work out a name for this build
        id: name
        run: |
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "apk=StockCheck-$SLUG-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          echo "demo=StockCheck-DEMO-$SLUG-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      # The APK first. A failing test still leaves something installable, and
      # an APK in hand beats a red tick and nothing to try.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename the APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${{ steps.name.outputs.apk }}"

      # A second APK with the licence check off, for showing the app to
      # somebody. Without one a demonstration ends on the screen that refuses
      # the person being shown it: they register their own company, it has no
      # licence, and there is nothing behind that screen to demonstrate.
      #
      # It says DEMO BUILD on the first screen and carries -demo in its
      # version, because the only thing worse than no demo is a free copy of
      # the product that cannot be told apart from the paid one.
      - name: Build the demo APK
        run: |
          ./gradlew assembleDebug -PdemoMode=true --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${{ steps.name.outputs.demo }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.apk }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # A release gives a plain download link. Artifacts arrive as a zip and
      # need a signed-in browser, which is awkward on the device that has to
      # install the thing.
      - name: Publish it where a phone can download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ steps.name.outputs.slug }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build — ${{ github.ref_name }}" \
            --notes "Debug build of \`${{ github.ref_name }}\` at \`${GITHUB_SHA::7}\`.

          Signed with the debug key, so it installs alongside a Play Store copy
          rather than replacing one. Enable *Install unknown apps* for your
          browser to install it.

          Two APKs. **StockCheck-...** is the real one, where a company needs a
          licence before it can start a count. **StockCheck-DEMO-...** has the
          licence check off for showing the app to somebody, says DEMO BUILD on
          the first screen, and is not for real stock.

          Not for release. Rebuilt on every push to this branch." \
            "app/build/outputs/apk/debug/${{ steps.name.outputs.apk }}" \
            "app/build/outputs/apk/debug/${{ steps.name.outputs.demo }}"

      # Last, so its failure never costs the APK above.
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Test report
        if: always()
        run: |
          {
            echo "## APK"
            echo ""
            echo '`${{ steps.name.outputs.apk }}`'
            echo ""
            echo "Download it from the Releases page: **build-${{ steps.name.outputs.slug }}**"
          } >> "$GITHUB_STEP_SUMMARY"
