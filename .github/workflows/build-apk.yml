name: Build APK

# Every push builds an installable APK and publishes it where a phone can
# reach it. The project is developed from a phone; a build that only exists on
# a developer's laptop is a build nobody can install.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time: two replacing the same download release at
# once leave it broken. A newer push cancels the older build.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      # Named so several APKs can sit in a downloads folder and still be told
      # apart: which branch, which commit.
      - name: Work out a name for this build
        id: name
        run: |
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "apk=StockCheck-$SLUG-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      # The APK first. A failing test still leaves something installable, and
      # an APK in hand beats a red tick and nothing to try.
      # Every build a higher number than the last (Google Play refuses one
      # it has seen, and Android will not install an older one over a newer).
      - name: Number this build
        run: echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # Signed with the key from the WEBAPPS_KEYSTORE secret (as Android's
      # debug key), so each new APK installs over the last one. Without the
      # secret, the runner's own fresh debug key: a new build then needs the
      # old app removed first.
      - name: Use the fixed key for JSOX Barcode Scan
        env:
          WEBAPPS_KEYSTORE: ${{ secrets.WEBAPPS_KEYSTORE }}
        run: |
          if [ -z "$WEBAPPS_KEYSTORE" ]; then echo "::warning::No WEBAPPS_KEYSTORE secret: JSOX Barcode Scan is signed with a one-off key."; exit 0; fi
          mkdir -p ~/.android
          printf '%s' "$WEBAPPS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/k.p12"
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -noprompt -srckeystore "$RUNNER_TEMP/k.p12" -srcstoretype PKCS12 -srcstorepass jexo-webapps -srcalias jexo \
            -destkeystore ~/.android/debug.keystore -deststoretype PKCS12 -deststorepass android -destkeypass android -destalias androiddebugkey
          rm -f "$RUNNER_TEMP/k.p12"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename the APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${{ steps.name.outputs.apk }}"

      # JSOX, JSOX POS, JSOX WMS and JSOX Every Data: the website's apps as
      # Android apps (webapps/), signed with the key in the WEBAPPS_KEYSTORE
      # secret so an installed copy takes the next one as an update.
      - name: Build the website apps
        env:
          WEBAPPS_KEYSTORE: ${{ secrets.WEBAPPS_KEYSTORE }}
        run: |
          KS=webapps/jexo-webapps.keystore
          if [ -n "$WEBAPPS_KEYSTORE" ]; then
            printf '%s' "$WEBAPPS_KEYSTORE" | base64 -d > "$KS"
          else
            echo "::warning::No WEBAPPS_KEYSTORE secret: these APKs get a one-off key, open with the address bar showing, and will not update over each other."
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias jexo -keyalg RSA -keysize 2048 -validity 12000 \
              -storepass jexo-webapps -keypass jexo-webapps -dname "CN=JSOX Apps (one-off), O=JSOX, C=MY"
          fi
          ./gradlew :webapps:assembleRelease --stacktrace || { rm -f "$KS"; exit 1; }
          rm -f "$KS"
          mkdir -p webapps-out
          for f in hub:JSOX pos:JSOX-POS warehouse:JSOX-WMS cloud:JSOX-EveryData; do
            cp "webapps/build/outputs/apk/${f%%:*}/release/webapps-${f%%:*}-release.apk" "webapps-out/${f##*:}.apk"
          done
          ls -l webapps-out

      # A spare copy; the release below is what phones download. Its storage
      # fills up, and that must never stop the release.
      # For Google Play: an Android App Bundle (.aab) of each app, signed with
      # the WEBAPPS_KEYSTORE key as the upload key. Only with that secret: a
      # bundle signed with a one-off key would tie the Play listing to a key
      # nobody has. Its failure never costs the APKs.
      - name: Build the Play Store bundles
        continue-on-error: true
        env:
          WEBAPPS_KEYSTORE: ${{ secrets.WEBAPPS_KEYSTORE }}
        run: |
          if [ -z "$WEBAPPS_KEYSTORE" ]; then echo "::warning::No WEBAPPS_KEYSTORE secret: no Play Store bundles."; exit 0; fi
          printf '%s' "$WEBAPPS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          cp "$RUNNER_TEMP/upload.p12" webapps/jexo-webapps.keystore
          printf 'storeFile=%s\nstorePassword=jexo-webapps\nkeyAlias=jexo\nkeyPassword=jexo-webapps\n' "$RUNNER_TEMP/upload.p12" > keystore.properties
          ./gradlew :app:bundleRelease :webapps:bundleRelease --stacktrace; status=$?
          rm -f "$RUNNER_TEMP/upload.p12" webapps/jexo-webapps.keystore keystore.properties
          [ $status -eq 0 ] || exit $status
          mkdir -p aab-out
          cp app/build/outputs/bundle/release/app-release.aab aab-out/JSOX-BarcodeScan.aab
          for f in hub:JSOX pos:JSOX-POS warehouse:JSOX-WMS cloud:JSOX-EveryData; do
            cp "webapps/build/outputs/bundle/${f%%:*}Release/webapps-${f%%:*}-release.aab" "aab-out/${f##*:}.aab"
          done
          ls -l aab-out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ${{ steps.name.outputs.apk }}
          path: |
            app/build/outputs/apk/debug/*.apk
            webapps-out/*.apk
          if-no-files-found: warn
          retention-days: 3

      # A release gives a plain download link. Artifacts arrive as a zip and
      # need a signed-in browser, which is awkward on the device that has to
      # install the thing.
      - name: Publish it where a phone can download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ steps.name.outputs.slug }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build — ${{ github.ref_name }}" \
            --notes "Debug build of \`${{ github.ref_name }}\` at \`${GITHUB_SHA::7}\`.

          Signed with the debug key, so it installs alongside a Play Store copy
          rather than replacing one. Enable *Install unknown apps* for your
          browser to install it.

          Not for release. Rebuilt on every push to this branch." \
            "app/build/outputs/apk/debug/${{ steps.name.outputs.apk }}" \
            webapps-out/*.apk $(ls aab-out/*.aab 2>/dev/null)

      # Last, so its failure never costs the APK above.
      - name: Unit tests
        run: ./gradlew :app:test --stacktrace

      - name: Test report
        if: always()
        run: |
          {
            echo "## APK"
            echo ""
            echo '`${{ steps.name.outputs.apk }}`'
            echo ""
            echo "Download it from the Releases page: **build-${{ steps.name.outputs.slug }}**"
          } >> "$GITHUB_STEP_SUMMARY"
