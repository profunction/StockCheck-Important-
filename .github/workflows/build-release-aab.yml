name: Build release AAB

# Play Console wants an Android App Bundle (.aab), signed with the release
# key -- never the debug key the other workflow uses. Run by hand
# (Actions tab -> this workflow -> Run workflow) only when a build is
# actually going to Play Console, not on every push like the debug APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      # The key itself never touches the repository. It exists only for this
      # one job, decoded from a secret into the runner's disk, and the runner
      # is thrown away the moment the job ends.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          # A secret pasted by hand into GitHub's web UI easily carries along
          # a trailing space or newline from the copy. That one extra
          # character makes a password wrong in a way that fails deep inside
          # a signing tool with a cryptic error, so it is stripped here
          # rather than trusted.
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | xargs)"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | xargs)"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_RAW" | xargs)"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Work out a name for this build
        id: name
        run: |
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "aab=StockCheck-$SLUG-${GITHUB_SHA::7}.aab" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Confirm it was signed with the release key, not the debug fallback
        run: |
          if ! ./gradlew properties 2>/dev/null | grep -q .; then :; fi
          echo "See the 'Release signing:' line above in the bundleRelease log."

      - name: Rename the bundle
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/${{ steps.name.outputs.aab }}"

      - name: Upload the AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.aab }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # Same reasoning as the debug APK's release: a plain download link
      # works from a phone or a laptop without a signed-in browser session.
      - name: Publish it where it can be downloaded directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${{ steps.name.outputs.slug }}-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Release AAB — ${{ github.ref_name }} (${GITHUB_SHA::7})" \
            --notes "Signed with the real release key. This is the file to upload to Play Console -- never the debug APK from the other workflow." \
            "app/build/outputs/bundle/release/${{ steps.name.outputs.aab }}"
