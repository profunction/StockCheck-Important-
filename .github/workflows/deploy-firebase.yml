name: Deploy to Firebase

# Publishes the database rules, the storage rules and the POS website.
#
# Until this, every rules change meant someone opening Cloud Shell and
# running `firebase deploy` by hand -- and a rules change the app depends on
# that nobody deployed is an app that says "permission denied". This runs
# the same emulator tests as rules-test.yml first, so rules that would lock
# people out never go live.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key from
# Firebase console -> Project settings -> Service accounts -> Generate new
# private key. Without it this workflow does nothing and stays green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'web/**'
      - 'api/**'
      - 'rules-test/**'
      - '.github/workflows/deploy-firebase.yml'

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT: stockcheck-fb58e

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Is deployment set up?
        id: setup
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. Add it under Settings -> Secrets and variables -> Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        if: steps.setup.outputs.ready == 'true'
        working-directory: rules-test
        run: npm ci || npm install

      - name: Test the website's arithmetic
        if: steps.setup.outputs.ready == 'true'
        run: for f in web/js/*.test.mjs; do node "$f"; done

      - name: Test the rules before they go live
        if: steps.setup.outputs.ready == 'true'
        working-directory: rules-test
        run: |
          npx firebase emulators:exec --project demo-stockcheck --only firestore "node branch-test.mjs"
          npx firebase emulators:exec --project demo-stockcheck --only firestore "node pos-test.mjs"

      - name: Sign in to Google
        if: steps.setup.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # The website reads its Firebase settings from /__/firebase/init.json,
      # which Hosting serves for the project's web app -- so there has to be
      # one. Made once, the first time.
      - name: Make sure a web app is registered
        if: steps.setup.outputs.ready == 'true'
        run: |
          FB=rules-test/node_modules/.bin/firebase
          count=$($FB apps:list WEB --project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result||[]).length)})')
          if [ "$count" = "0" ]; then
            $FB apps:create WEB "Stock Check POS" --project "$PROJECT" --non-interactive
          fi

      - name: Deploy database rules, indexes and the website
        if: steps.setup.outputs.ready == 'true'
        run: rules-test/node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes,hosting --project "$PROJECT" --non-interactive

      # Separate, because storage rules that read the database need a
      # permission granted to Storage once; if that is missing the rest has
      # still gone out, and the log says what to do.
      - name: Deploy storage rules
        if: steps.setup.outputs.ready == 'true'
        run: rules-test/node_modules/.bin/firebase deploy --only storage --project "$PROJECT" --non-interactive --force

      # The POS API runs on Cloud Run. Deploying it needs Cloud Run and
      # Cloud Build permissions on the key's account, granted once (see the
      # README in api/). Without them the website still goes out.
      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.setup.outputs.ready == 'true'

      - name: Deploy the POS API
        id: api
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        run: |
          diff -u web/js/ledger.js api/ledger.js
          gcloud run deploy stockcheck-api --source api --region asia-southeast1 --project "$PROJECT" \
            --allow-unauthenticated --memory 512Mi --max-instances 3 --quiet

      - name: If the API did not deploy
        if: steps.setup.outputs.ready == 'true' && steps.api.outcome == 'failure'
        run: |
          echo "::warning::The POS API was not deployed. The key's account needs Cloud Run Admin, Cloud Build Editor, Service Account User and Artifact Registry Admin. See api/README.md."

      - name: Where it is
        if: steps.setup.outputs.ready == 'true'
        run: |
          echo "::notice::POS website https://${PROJECT}.web.app"

      - name: Forget the key
        if: always() && steps.setup.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/sa.json"
