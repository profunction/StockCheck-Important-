name: Deploy to Firebase

# Publishes the database rules, the storage rules and the POS website.
#
# Until this, every rules change meant someone opening Cloud Shell and
# running `firebase deploy` by hand -- and a rules change the app depends on
# that nobody deployed is an app that says "permission denied". This runs
# the same emulator tests as rules-test.yml first, so rules that would lock
# people out never go live.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key from
# Firebase console -> Project settings -> Service accounts -> Generate new
# private key. Without it this workflow does nothing and stays green.
on:
  workflow_dispatch:
  # A new APK is put on the website as soon as it is built.
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'web/**'
      - 'site/**'
      - 'api/**'
      - 'rules-test/**'
      - 'tools/videos/voice.mjs'
      - 'tools/videos/mp4.mjs'
      - 'tools/videos/sound.mjs'
      - '.github/workflows/deploy-firebase.yml'

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT: stockcheck-fb58e

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Is deployment set up?
        id: setup
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. Add it under Settings -> Secrets and variables -> Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        if: steps.setup.outputs.ready == 'true'
        working-directory: rules-test
        run: npm ci || npm install

      - name: Test the website's arithmetic
        if: steps.setup.outputs.ready == 'true'
        run: for f in web/js/*.test.mjs; do node "$f"; done

      - name: Test the rules before they go live
        if: steps.setup.outputs.ready == 'true'
        working-directory: rules-test
        run: |
          npx firebase emulators:exec --project demo-stockcheck --only firestore "node branch-test.mjs"
          npx firebase emulators:exec --project demo-stockcheck --only firestore "node pos-test.mjs"

      - name: Sign in to Google
        if: steps.setup.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # The website reads its Firebase settings from /__/firebase/init.json,
      # which Hosting serves for the project's web app -- so there has to be
      # one. Made once, the first time.
      - name: Make sure a web app is registered
        if: steps.setup.outputs.ready == 'true'
        run: |
          FB=rules-test/node_modules/.bin/firebase
          count=$($FB apps:list WEB --project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result||[]).length)})')
          if [ "$count" = "0" ]; then
            $FB apps:create WEB "Stock Check POS" --project "$PROJECT" --non-interactive
          fi

      # The public pages are built from site/; built again here so the
      # sitemap's dates are the day of the deploy.
      - name: Build the public pages
        if: steps.setup.outputs.ready == 'true'
        run: node site/build.mjs

      # The repository is private, so its releases cannot be downloaded by
      # customers: the latest APK is served from the website instead.
      - name: Put the latest Android app on the website
        if: steps.setup.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/download
          if gh release download build-main --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/apk --clobber; then
            # SuXin Barcode Scan (the native app) keeps its old address too.
            for f in /tmp/apk/StockCheck-*.apk; do cp "$f" web/download/SuXin-BarcodeScan.apk; cp "$f" web/download/SuXin-Count.apk; mv "$f" web/download/StockCheck.apk; done
            # SuXin, SuXin POS, SuXin WMS, SuXin Every Data.
            mv /tmp/apk/SuXin*.apk web/download/ 2>/dev/null || echo "::warning::No website-app APKs in the release yet."
            # The names before the rename keep working.
            [ -f web/download/SuXin-WMS.apk ] && cp web/download/SuXin-WMS.apk web/download/SuXin-Warehouse.apk
            [ -f web/download/SuXin-EveryData.apk ] && cp web/download/SuXin-EveryData.apk web/download/SuXin-Cloud.apk
            ls -l web/download
          else
            echo "::warning::No APK release found; the download link will not work until Build APK has run."
          fi

      # Chrome shows SuXin, SuXin POS, SuXin WMS and SuXin Every Data without an
      # address bar only if the website names their signing key here. Worked
      # out from the same secret the APKs are signed with; PLAY_SHA256 (a
      # repository variable) adds Google Play's key once they are on Play.
      - name: Let the website vouch for its Android apps
        if: steps.setup.outputs.ready == 'true'
        env:
          WEBAPPS_KEYSTORE: ${{ secrets.WEBAPPS_KEYSTORE }}
          PLAY_SHA256: ${{ vars.PLAY_SHA256 }}
        run: |
          FPS="$PLAY_SHA256"
          if [ -n "$WEBAPPS_KEYSTORE" ]; then
            printf '%s' "$WEBAPPS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/webapps.p12"
            FP=$(keytool -list -v -keystore "$RUNNER_TEMP/webapps.p12" -storepass jexo-webapps | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
            rm -f "$RUNNER_TEMP/webapps.p12"
            FPS="$FP${FPS:+,$FPS}"
          fi
          if [ -z "$FPS" ]; then echo "::warning::No WEBAPPS_KEYSTORE secret: the Android website apps will show the address bar."; exit 0; fi
          mkdir -p web/.well-known
          FPS="$FPS" node -e '
            const fps = process.env.FPS.split(",").map((s) => s.trim()).filter(Boolean);
            const apps = ["com.suxin.apps", "com.suxin.pos", "com.suxin.warehouse", "com.suxin.cloud"];
            console.log(JSON.stringify(apps.map((p) => ({ relation: ["delegate_permission/common.handle_all_urls"],
              target: { namespace: "android_app", package_name: p, sha256_cert_fingerprints: fps } })), null, 2));
          ' > web/.well-known/assetlinks.json
          cat web/.well-known/assetlinks.json

      # The guide videos' voice: a recorded male voice (Google Cloud
      # Text-to-Speech, tools/videos/voice.mjs), made once per step and kept
      # between deploys. If it cannot be made, the pages use the device's
      # own voice and the website still goes out.
      - name: Keep the guide voice recordings between deploys
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: web/videos/voice
          key: voice-${{ hashFiles('web/videos/**/*.webm.json', 'tools/videos/voice.mjs') }}
          restore-keys: voice-

      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true

      - name: Record the guide videos' voice
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        run: |
          gcloud services enable texttospeech.googleapis.com --project "$PROJECT" \
            || echo "::warning::Could not switch on Text-to-Speech; switch it on once at https://console.cloud.google.com/apis/library/texttospeech.googleapis.com?project=$PROJECT"
          GCP_TOKEN=$(gcloud auth print-access-token) node tools/videos/voice.mjs
          du -sh web/videos/voice 2>/dev/null || true

      # The marketing films as MP4 with the voice laid over them, for TikTok,
      # Instagram, Facebook and WhatsApp (tools/videos/mp4.mjs). Made again
      # only when a film or its voice changes.
      - name: Keep the marketing MP4s between deploys
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: web/videos/promo-*.mp4
          key: mp4-${{ hashFiles('web/videos/promo-*.webm', 'web/videos/promo-*.webm.json', 'web/videos/voice/*.mp3', 'tools/videos/mp4.mjs', 'tools/videos/sound.mjs') }}

      - name: Make the marketing MP4s
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        run: |
          if ! ls web/videos/promo-*.mp4 >/dev/null 2>&1; then
            which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fi
          node tools/videos/mp4.mjs | tee /tmp/mp4.log
          echo "::notice::Marketing MP4s: $(ls web/videos/promo-*.mp4 2>/dev/null | wc -l) made. $(tr '\n' ' ' < /tmp/mp4.log)"

      - name: Deploy database rules, indexes and the website
        if: steps.setup.outputs.ready == 'true'
        run: rules-test/node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes,hosting --project "$PROJECT" --non-interactive

      # Separate, because storage rules that read the database need a
      # permission granted to Storage once; if that is missing the rest has
      # still gone out, and the log says what to do.
      - name: Deploy storage rules
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        run: rules-test/node_modules/.bin/firebase deploy --only storage --project "$PROJECT" --non-interactive --force

      # The POS API runs on Cloud Run. Deploying it needs Cloud Run and
      # Cloud Build permissions on the key's account, granted once (see the
      # README in api/). Without them the website still goes out.
      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.setup.outputs.ready == 'true'

      - name: Deploy the POS API
        id: api
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        run: |
          diff -u web/js/ledger.js api/ledger.js
          diff -u web/js/wms.js api/wms.js
          diff -u web/js/money.js api/money.js
          # The bot's and the report's secrets live in Secret Manager, never
          # here. Two are made on the first run (random, nobody needs to know
          # them); the others are added by the owner when they want that
          # channel -- whatever is missing is simply not sent.
          for s in job-key telegram-secret; do
            gcloud secrets describe "$s" --project "$PROJECT" >/dev/null 2>&1 || \
              openssl rand -hex 24 | tr -d '\n' | gcloud secrets create "$s" --project "$PROJECT" --replication-policy automatic --data-file=-
          done
          SECRETS=""
          RUNTIME_SA="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')-compute@developer.gserviceaccount.com"
          for pair in JOB_KEY=job-key TELEGRAM_SECRET=telegram-secret TELEGRAM_BOT_TOKEN=telegram-bot-token SMTP_USER=smtp-user SMTP_PASS=smtp-pass ANTHROPIC_API_KEY=anthropic-api-key; do
            name="${pair#*=}"
            if gcloud secrets describe "$name" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud secrets add-iam-policy-binding "$name" --project "$PROJECT" --member "serviceAccount:$RUNTIME_SA" \
                --role roles/secretmanager.secretAccessor --quiet >/dev/null
              SECRETS="${SECRETS:+$SECRETS,}${pair}:latest"
            fi
          done
          gcloud run deploy stockcheck-api --source api --region asia-southeast1 --project "$PROJECT" \
            --allow-unauthenticated --memory 512Mi --max-instances 3 --quiet \
            ${SECRETS:+--set-secrets "$SECRETS"} \
            --set-env-vars "WEB_PUSH_VAPID_KEY=${{ vars.WEB_PUSH_VAPID_KEY }}"

      # The morning report at 8 (Malaysia), and the bot pointed at the API.
      - name: The bot and the morning report
        if: steps.setup.outputs.ready == 'true' && steps.api.outcome == 'success'
        continue-on-error: true
        run: |
          URL=$(gcloud run services describe stockcheck-api --region asia-southeast1 --project "$PROJECT" --format='value(status.url)')
          KEY=$(gcloud secrets versions access latest --secret job-key --project "$PROJECT" | tr -d '[:space:]')
          echo "::add-mask::$KEY"
          curl -fsS -X POST -H "x-job-key: $KEY" "$URL/jobs/setup"; echo
          ARGS=(--location asia-southeast1 --project "$PROJECT" --schedule "0 8 * * *" --time-zone "Asia/Kuala_Lumpur"
                --uri "$URL/jobs/daily" --http-method POST)
          if gcloud scheduler jobs describe suxin-daily --location asia-southeast1 --project "$PROJECT" >/dev/null 2>&1; then
            gcloud scheduler jobs update http suxin-daily "${ARGS[@]}" --update-headers "x-job-key=$KEY" --quiet
          else
            gcloud scheduler jobs create http suxin-daily "${ARGS[@]}" --headers "x-job-key=$KEY" --quiet
          fi

      - name: If the API did not deploy
        if: steps.setup.outputs.ready == 'true' && steps.api.outcome == 'failure'
        run: |
          echo "::warning::The POS API was not deployed. The key's account needs Cloud Run Admin, Cloud Build Editor, Service Account User, Artifact Registry Admin, Secret Manager Admin and Cloud Scheduler Admin. See api/README.md."

      - name: Where it is
        if: steps.setup.outputs.ready == 'true'
        run: |
          echo "::notice::POS website https://${PROJECT}.web.app"

      - name: Forget the key
        if: always() && steps.setup.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/sa.json"
