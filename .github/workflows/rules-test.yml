name: Firestore rules tests

# Runs firestore.rules in the Firestore emulator against the queries the app
# actually sends. Deploys nothing: the live rules only change when someone
# runs `firebase deploy --only firestore:rules` by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'rules-test/**'
      - 'api/**'
      - 'web/js/ledger.js'
      - 'web/js/offline.js'
      - 'platform/plans.mjs'
      - '.github/workflows/rules-test.yml'

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci || npm install

      - name: Branch scoping
        run: npx firebase emulators:exec --project demo-stockcheck --only firestore "node branch-test.mjs"

      - name: POS website
        run: npx firebase emulators:exec --project demo-stockcheck --only firestore "node pos-test.mjs"

  # The POS API against the Firestore emulator.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: The API's stock maths, plans and offline merge are the website's
        run: |
          diff -u web/js/ledger.js api/ledger.js
          diff -u platform/plans.mjs api/plans.js
          diff -u web/js/offline.js api/offline.js
          diff -u web/js/modules.js api/modules.js
      - run: npm ci || npm install
        working-directory: rules-test
      - run: npm install --no-audit --no-fund
        working-directory: api
      - run: node lib.test.mjs && node middleware.test.mjs && node bot.test.mjs && node notify.test.mjs
        working-directory: api
      - name: End to end
        working-directory: rules-test
        run: npx firebase emulators:exec --project demo-stockcheck --only firestore "node ../api/api-test.mjs"
