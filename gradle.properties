org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
# This machine has 8GB total RAM shared with a browser, AnyDesk and whatever
# else is open, so a lingering daemon competing for memory has caused a build
# to be OOM-killed before. --no-daemon is already passed on every invocation,
# but this makes non-daemon mode the default too, belt and braces.
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
